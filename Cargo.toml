[package]
name = "mp_agent"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-openai = { version = "0.41", features = ["chat-completion"] }
rmcp = { version = "0.8", features = ["client", "transport-io", "transport-child-process"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
dotenvy = "0.15"
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
eventsource-stream = "0.2"
pulldown-cmark = "0.13"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
