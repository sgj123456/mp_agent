[package]
name = "mp_agent"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "test_mcp_server"
path = "bin/test_mcp_server.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-openai = { version = "0.41", features = ["chat-completion"] }
rmcp = { version = "0.8", features = ["client", "transport-io", "transport-child-process", "transport-async-rw", "server", "macros"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
dotenvy = "0.15"
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
eventsource-stream = "0.2"
tui-markdown = "0.3"
unicode-width = "0.2"
arboard = { version = "3.6", features = ["wayland-data-control"] }
schemars = "0.8"
anyhow = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
